<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Locação - Locadora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-50: #eef2ff;
            --green-100: #e0e7ff;
            --green-200: #c7d2fe;
            --green-300: #a5b4fc;
            --green-400: #818cf8;
            --green-500: #6366f1;
            --green-600: #4f46e5;
            --green-700: #4338ca;
            --green-800: #3730a3;
            --green-900: #312e81;
            --gray-50: #0b1120;
            --gray-100: #111a2e;
            --gray-200: #1e293b;
            --gray-300: #334155;
            --gray-400: #64748b;
            --gray-500: #94a3b8;
            --gray-600: #cbd5e1;
            --gray-700: #e2e8f0;
            --gray-800: #f1f5f9;
            --gray-900: #f8fafc;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            min-height: 100vh;
            background: var(--gray-50);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
        }

        .orb-1 {
            width: 500px; height: 500px;
            background: var(--green-400);
            top: -100px; left: -100px;
            animation: orbFloat1 12s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px; height: 400px;
            background: var(--green-600);
            bottom: -80px; right: -80px;
            animation: orbFloat2 15s ease-in-out infinite;
        }

        .orb-3 {
            width: 300px; height: 300px;
            background: var(--green-200);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 10s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.1); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, -40px) scale(1.08); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-48%, -52%) scale(1.12); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        .header {
            margin-bottom: 28px;
            opacity: 0;
            transform: translateY(-20px);
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--green-100);
            color: var(--green-700);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 100px;
            margin-bottom: 12px;
            border: 1px solid var(--green-200);
        }

        .header-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green-500);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--gray-900);
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--green-600);
        }

        .card {
            background: var(--gray-100);
            border-radius: 20px;
            border: 1px solid var(--gray-200);
            padding: 32px;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.03),
                0 4px 6px -1px rgba(0,0,0,0.04),
                0 20px 60px -10px rgba(0,0,0,0.08);
            opacity: 0;
            transform: translateY(30px);
        }

        .progress-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 28px;
        }

        .progress-step {
            flex: 1;
            height: 3px;
            border-radius: 100px;
            background: var(--gray-200);
            overflow: hidden;
            position: relative;
        }

        .progress-step.active .fill {
            width: 100%;
            background: linear-gradient(90deg, var(--green-400), var(--green-600));
            height: 100%;
            border-radius: 100px;
            animation: progressIn 0.6s ease forwards;
        }

        .progress-step.done .fill {
            width: 100%;
            background: var(--green-500);
            height: 100%;
            border-radius: 100px;
        }

        .progress-step.pending .fill {
            width: 0%;
            height: 100%;
        }

        @keyframes progressIn {
            from { width: 0; }
            to { width: 100%; }
        }

        .field-group {
            margin-bottom: 20px;
            opacity: 0;
            transform: translateX(-16px);
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-500);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--gray-400);
            pointer-events: none;
            transition: color 0.2s;
        }

        select, input[type="date"], input[type="number"] {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: var(--gray-800);
            background: var(--gray-50);
            border: 1.5px solid var(--gray-200);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        select:hover, input:hover {
            border-color: var(--green-400);
            background: var(--gray-200);
        }

        select:focus, input:focus {
            border-color: var(--green-500);
            background: var(--gray-200);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }

        select:focus ~ .input-icon,
        input:focus ~ .input-icon {
            color: var(--green-500);
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--gray-400);
            transition: transform 0.2s, color 0.2s;
        }

        select:focus ~ .select-arrow {
            transform: translateY(-50%) rotate(180deg);
            color: var(--green-500);
        }

        .add-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 500;
            color: var(--green-600);
            text-decoration: none;
            margin-top: 8px;
            padding: 4px 0;
            border-bottom: 1px dashed var(--green-300);
            transition: all 0.2s;
        }

        .add-link:hover {
            color: var(--green-700);
            border-bottom-color: var(--green-500);
            gap: 6px;
        }

        .date-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .value-display {
            position: relative;
            overflow: hidden;
        }

        .value-display input {
            background: var(--green-50);
            border-color: var(--green-200);
            font-weight: 500;
            color: var(--green-800);
            font-size: 15px;
        }

        .value-display input:focus {
            background: var(--gray-200);
        }

        .currency-prefix {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            font-weight: 600;
            color: var(--green-600);
            pointer-events: none;
        }

        .value-display input {
            padding-left: 40px;
        }

        .divider {
            height: 1px;
            background: var(--gray-100);
            margin: 24px 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            opacity: 0;
            transform: translateY(16px);
        }

        .btn-primary {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 20px;
            background: var(--green-600);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            background: var(--green-700);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -4px rgba(79,70,229,0.4);
        }

        .btn-primary:hover::before { opacity: 1; }

        .btn-primary:active {
            transform: translateY(0px) scale(0.98);
            box-shadow: none;
        }

        .btn-ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 18px;
            background: transparent;
            color: var(--gray-500);
            border: 1.5px solid var(--gray-200);
            border-radius: 12px;
            font-family: 'Inter', Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
            color: var(--gray-700);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            transition: transform 0.2s;
        }

        .btn-primary:hover .btn-icon { transform: translateX(2px); }
        .btn-secondary:hover .btn-icon { transform: translateX(-2px); }

        .summary-pill {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--green-50);
            border: 1px solid var(--green-100);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .summary-pill.visible { display: flex; }

        .summary-label { color: var(--gray-500); font-weight: 500; }
        .summary-value { color: var(--green-700); font-weight: 700; font-size: 15px; }

        @media (max-width: 480px) {
            .card { padding: 24px 20px; }
            .date-row { grid-template-columns: 1fr; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-badge">Locadora</div>
            <h1>Nova <span>Locação</span></h1>
        </div>

        <div class="card">
            <div class="progress-bar" aria-hidden="true">
                <div class="progress-step done"><div class="fill"></div></div>
                <div class="progress-step active"><div class="fill"></div></div>
                <div class="progress-step pending"><div class="fill"></div></div>
            </div>

            <form method="POST" id="rental-form">

                <div class="field-group" id="fg-client">
                    <label for="cliente_id">Cliente</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <select name="cliente_id" id="cliente_id" required>
                            <option value="">Selecione um cliente</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.id }}">{{ cliente.nome }} — {{ cliente.cpf }}</option>
                            {% endfor %}
                        </select>
                        <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <a href="{{ url_for('locadora.cadastrar_cliente') }}" class="add-link">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Cadastrar novo cliente
                    </a>
                </div>

                <div class="field-group" id="fg-vehicle">
                    <label for="veiculo_id">Veículo</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="1" y="3" width="15" height="13" rx="2"/>
                            <path d="M16 8h4l3 3v3h-7V8z"/>
                            <circle cx="5.5" cy="18.5" r="2.5"/>
                            <circle cx="18.5" cy="18.5" r="2.5"/>
                        </svg>
                        <select name="veiculo_id" id="veiculo_id" required>
                            <option value="">Selecione um veículo</option>
                            {% for veiculo in veiculos %}
                            <option value="{{ veiculo.id }}" data-diaria="{{ veiculo.diaria }}">{{ veiculo.modelo }} ({{ veiculo.placa }}) — R$ {{ "%.2f"|format(veiculo.diaria) }}/dia</option>
                            {% endfor %}
                        </select>
                        <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                </div>

                <div class="date-row">
                    <div class="field-group" id="fg-start">
                        <label for="data_inicio">Data início</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            <input type="date" name="data_inicio" id="data_inicio" required>
                        </div>
                    </div>

                    <div class="field-group" id="fg-end">
                        <label for="data_fim">Data fim</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                                <path d="M9 16l2 2 4-4"/>
                            </svg>
                            <input type="date" name="data_fim" id="data_fim" required>
                        </div>
                    </div>
                </div>

                <div class="summary-pill" id="summary-pill">
                    <span class="summary-label" id="summary-days">— dias</span>
                    <span class="summary-value" id="summary-total">R$ 0,00</span>
                </div>

                <div class="field-group" id="fg-value">
                    <label for="valor_total">Valor Total</label>
                    <div class="input-wrapper value-display">
                        <span class="currency-prefix" aria-hidden="true">R$</span>
                        <input type="number" step="0.01" name="valor_total" id="valor_total" placeholder="0,00" required>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="actions" id="actions">
                    <a href="{{ url_for('locadora.index') }}" class="btn-secondary">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="19" y1="12" x2="5" y2="12"/>
                            <polyline points="12 19 5 12 12 5"/>
                        </svg>
                        Cancelar
                    </a>
                    <button type="submit" class="btn-primary" id="submit-btn">
                        Salvar locação
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

            tl.to('.header', { opacity: 1, y: 0, duration: 0.6 })
              .to('.card', { opacity: 1, y: 0, duration: 0.7 }, '-=0.3')
              .to('#fg-client', { opacity: 1, x: 0, duration: 0.4 }, '-=0.3')
              .to('#fg-vehicle', { opacity: 1, x: 0, duration: 0.4 }, '-=0.2')
              .to('#fg-start', { opacity: 1, x: 0, duration: 0.4 }, '-=0.2')
              .to('#fg-end', { opacity: 1, x: 0, duration: 0.4 }, '-=0.3')
              .to('#fg-value', { opacity: 1, x: 0, duration: 0.4 }, '-=0.2')
              .to('#actions', { opacity: 1, y: 0, duration: 0.4 }, '-=0.2');

            const vehicleSelect = document.getElementById('veiculo_id');
            const startDate = document.getElementById('data_inicio');
            const endDate = document.getElementById('data_fim');
            const totalInput = document.getElementById('valor_total');
            const summaryPill = document.getElementById('summary-pill');
            const summaryDays = document.getElementById('summary-days');
            const summaryTotal = document.getElementById('summary-total');

            function calcTotal() {
                const opt = vehicleSelect.options[vehicleSelect.selectedIndex];
                const diaria = parseFloat(opt?.dataset?.diaria || 0);
                const d1 = new Date(startDate.value);
                const d2 = new Date(endDate.value);

                if (diaria && startDate.value && endDate.value && d2 > d1) {
                    const dias = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
                    const total = (dias * diaria).toFixed(2);
                    totalInput.value = total;
                    summaryDays.textContent = `${dias} dia${dias > 1 ? 's' : ''}`;
                    summaryTotal.textContent = `R$ ${parseFloat(total).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;

                    if (!summaryPill.classList.contains('visible')) {
                        summaryPill.classList.add('visible');
                        gsap.from(summaryPill, { opacity: 0, y: -8, duration: 0.3, ease: 'power2.out' });
                    }
                } else {
                    summaryPill.classList.remove('visible');
                    if (!totalInput.value) totalInput.value = '';
                }
            }

            [vehicleSelect, startDate, endDate].forEach(el => el.addEventListener('change', calcTotal));

            document.getElementById('submit-btn').addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                ripple.className = 'btn-ripple';
                ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
                this.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            });

            document.querySelectorAll('select, input').forEach(el => {
                el.addEventListener('focus', function() {
                    const wrapper = this.closest('.field-group');
                    if (wrapper) gsap.to(wrapper.querySelector('label'), { color: '#16a34a', duration: 0.2 });
                });
                el.addEventListener('blur', function() {
                    const wrapper = this.closest('.field-group');
                    if (wrapper) gsap.to(wrapper.querySelector('label'), { color: '#6b7280', duration: 0.2 });
                });
            });
        });
    </script>
</body>
</html>
