<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos Completa</title>
    <style>
        body { background: #0b1120; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; padding: 20px; }
        h2 { color: #e2e8f0; }
        a { color: #6366f1; }
        a:hover { color: #4f46e5; }
        table { width: 100%; border-collapse: collapse; background: #111a2e; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
        th { background: #1e293b; color: #94a3b8; text-align: left; border-bottom: 1px solid #334155; }
        td { border-bottom: 1px solid #334155; color: #e2e8f0; }
        tr:last-child td { border-bottom: none; }
        .aprovado { color: #4ade80; font-weight: bold; }
        .reprovado { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Lista de Alunos, Idades e Notas</h2>
    
    <table cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Idade</th>
                <th>Nota</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for aluno in alunos %}
            <tr>
                <td>{{ aluno.nome }}</td>
                <td>{{ aluno.idade }} anos</td>
                <td>{{ aluno.nota }}</td>
                <td>
                    {% if aluno.nota >= 7 %}
                        <span class="aprovado">Aprovado</span>
                    {% else %}
                        <span class="reprovado">Reprovado</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
